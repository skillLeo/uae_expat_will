# The vhost used before a certificate exists.
#
# nginx refuses to start a server block that listens with `ssl` and has no
# certificate, so the full config cannot be installed until certbot has run.
# Commenting the TLS lines out of the real config with sed was fragile -- it
# missed `listen [::]:443 ssl` and left nginx unable to start at all.
#
# A separate, deliberately plain file is easier to reason about: it serves the
# application over HTTP so the site can be checked before DNS moves, and it
# serves the ACME challenge so the certificate can be issued. ssl.sh replaces
# it with nginx-uaeexpatwills.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name uaeexpatwills.com www.uaeexpatwills.com _;

    root /var/www/uaeexpatwills/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25M;

    access_log /var/log/nginx/uaeexpatwills.access.log;
    error_log  /var/log/nginx/uaeexpatwills.error.log;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt and sitemap.xml are Laravel routes and must fall through.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-uew.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
