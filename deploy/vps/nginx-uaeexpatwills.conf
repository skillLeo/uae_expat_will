# uaeexpatwills.com
#
# The application sets its own security headers in SecurityHeaders middleware,
# including the CSP. Nothing is added here that would duplicate or contradict
# them: two Content-Security-Policy headers are intersected by the browser, and
# debugging that is miserable.

# www redirects to the apex. One canonical host, so search engines are never
# choosing between two copies of the same page.
server {
    listen 80;
    listen [::]:80;
    server_name www.uaeexpatwills.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://uaeexpatwills.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.uaeexpatwills.com;

    ssl_certificate     /etc/letsencrypt/live/uaeexpatwills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uaeexpatwills.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://uaeexpatwills.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name uaeexpatwills.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://uaeexpatwills.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name uaeexpatwills.com;

    root /var/www/uaeexpatwills/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/uaeexpatwills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uaeexpatwills.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploaded documents can be large; the PHP pool allows 25M to match.
    client_max_body_size 25M;

    access_log /var/log/nginx/uaeexpatwills.access.log;
    error_log  /var/log/nginx/uaeexpatwills.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # Vite writes content-hashed filenames, so these can be cached hard and
    # forever. A new build produces new names.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; expires 30d; }

    # robots.txt and sitemap.xml are deliberately NOT matched here. They are
    # Laravel routes, and a static file or a try_files rule that answers them
    # first is exactly the bug that left the sitemap undeclared and /admin
    # crawlable on the old host.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-uew.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Dotfiles, but not ACME's directory.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
